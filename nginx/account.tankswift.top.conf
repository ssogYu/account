# ============================================================
# Nginx 反向代理配置
# 域名: account.tankswift.top
# 用途: API 代理 + MinIO 文件访问代理 + 静态页面
# ============================================================

upstream nestjs_server {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream minio_api {
    server 127.0.0.1:9000;
    keepalive 64;
}

# ---- HTTP -> HTTPS 重定向 ----
server {
    listen 80;
    listen [::]:80;
    server_name account.tankswift.top;
    return 301 https://$host$request_uri;
}

# ---- HTTPS 主站 ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name account.tankswift.top;

    # ============================
    # SSL 证书（存放在项目目录 /srv/account/nginx/ssl/）
    # ============================
    ssl_certificate     /srv/account/nginx/ssl/account.tankswift.top.pem;
    ssl_certificate_key /srv/account/nginx/ssl/account.tankswift.top.key;

    # ============================
    # SSL 安全配置
    # ============================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 上传限制（图片 + 语音文件，Fastify multipart 限制为 10MB，此处设 20MB 留余量）
    client_max_body_size 20m;

    # ============================
    # 静态页面
    # ============================
    location = /privacy.html {
        alias /srv/account/nginx/pages/privacy.html;
    }

    # ============================
    # 健康检查
    # ============================
    location = /health {
        proxy_pass http://nestjs_server/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ============================
    # NestJS API 代理
    # ============================
    location /api/ {
        proxy_pass http://nestjs_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ============================
    # MinIO 文件访问代理
    # /files/account/avatars/xxx.jpg -> MinIO /account/avatars/xxx.jpg
    # ============================
    location /files/ {
        proxy_pass http://minio_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 文件缓存（静态资源缓存 7 天）
        expires 7d;
        add_header Cache-Control "public, immutable";

        # 大文件支持
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
