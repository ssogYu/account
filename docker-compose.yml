services:
  postgres:
    image: postgres:16-alpine
    container_name: common-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: common
      POSTGRES_PASSWORD: common123
      POSTGRES_DB: common
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U common -d common']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
